<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Controle de Finanças</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="https://raw.githubusercontent.com/CaioFerAmorim/controle-financas/refs/heads/main/static/img/logoWildMoneyIcon.ico" type="image/x-icon">
    <style>
        body { background: #f0f4f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.10); padding: 40px 36px; width: 100%; max-width: 420px; }
        .auth-logo { width: 70px; height: 70px; }
        .btn-primary-green { background: #1A4D2E; border: none; color: #fff; width: 100%; padding: 10px; border-radius: 8px; font-weight: 500; transition: background .2s; }
        .btn-primary-green:hover { background: #143d25; color: #fff; }
        .form-control:focus { border-color: #1A4D2E; box-shadow: 0 0 0 3px rgba(26,77,46,.15); }
        .link-green { color: #1A4D2E; text-decoration: none; }
        .link-green:hover { text-decoration: underline; }
        .strength-bar { height: 4px; border-radius: 2px; transition: all .3s; background: #dee2e6; margin-top: 6px; }
        .strength-bar div { height: 100%; border-radius: 2px; transition: all .3s; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <img src="https://raw.githubusercontent.com/CaioFerAmorim/controle-financas/e24343c1468b7c5f06a8230f0913f834dab0635b/static/img/logoWildMoney.png"
                 alt="Logo" class="auth-logo mb-2">
            <h4 class="mb-0" style="color:#1A4D2E;font-weight:700;">Criar conta</h4>
            <small class="text-muted">Comece a controlar suas finanças</small>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('cadastro') }}">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">Nome completo</label>
                <input type="text" name="nome" class="form-control" placeholder="Seu nome"
                       value="{{ nome or '' }}" autocomplete="name" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">Email</label>
                <input type="email" name="email" class="form-control" placeholder="seu@email.com"
                       value="{{ email or '' }}" autocomplete="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">Senha</label>
                <input type="password" name="senha" id="senha" class="form-control"
                       placeholder="Mínimo 8 caracteres" autocomplete="new-password" required
                       minlength="8" oninput="atualizarForca(this.value)">
                <div class="strength-bar"><div id="forca" style="width:0%"></div></div>
                <small id="forcaTexto" class="text-muted" style="font-size:11px;"></small>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold text-muted">Confirmar senha</label>
                <input type="password" name="confirmar_senha" id="confirmarSenha" class="form-control"
                       placeholder="Repita a senha" autocomplete="new-password" required
                       oninput="verificarSenhas()">
                <small id="senhaMatch" style="font-size:11px;"></small>
            </div>
            <button type="submit" class="btn btn-primary-green">Criar conta</button>
        </form>

        <hr class="my-4">
        <p class="text-center text-muted small mb-0">
            Já tem conta? <a href="{{ url_for('login') }}" class="link-green fw-semibold">Fazer login</a>
        </p>
    </div>

    <script>
    function atualizarForca(senha) {
        const barra = document.getElementById('forca');
        const texto = document.getElementById('forcaTexto');
        let pontos = 0;
        if (senha.length >= 8)  pontos++;
        if (senha.length >= 12) pontos++;
        if (/[A-Z]/.test(senha)) pontos++;
        if (/[0-9]/.test(senha)) pontos++;
        if (/[^A-Za-z0-9]/.test(senha)) pontos++;

        const config = [
            { w: '0%',   cor: '#dee2e6', label: '' },
            { w: '25%',  cor: '#dc3545', label: 'Muito fraca' },
            { w: '50%',  cor: '#fd7e14', label: 'Fraca' },
            { w: '75%',  cor: '#ffc107', label: 'Boa' },
            { w: '90%',  cor: '#20c997', label: 'Forte' },
            { w: '100%', cor: '#1A4D2E', label: 'Muito forte' },
        ];
        const c = config[Math.min(pontos, 5)];
        barra.style.width = c.w;
        barra.style.background = c.cor;
        texto.textContent = c.label;
        texto.style.color = c.cor;
    }

    function verificarSenhas() {
        const s1 = document.getElementById('senha').value;
        const s2 = document.getElementById('confirmarSenha').value;
        const el = document.getElementById('senhaMatch');
        if (!s2) { el.textContent = ''; return; }
        if (s1 === s2) {
            el.textContent = '✓ Senhas coincidem';
            el.style.color = '#1A4D2E';
        } else {
            el.textContent = '✗ Senhas não coincidem';
            el.style.color = '#dc3545';
        }
    }
    </script>
</body>
</html>
